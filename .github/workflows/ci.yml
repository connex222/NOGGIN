name: NOGGIN tests
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit and gateway tests
        run: npm test
      - name: Generate rules PDF from current game source
        run: |
          python -m pip install -r requirements-docs.txt
          python tools/make-how-to-play.py
      - name: Release audit
        run: npm run audit
