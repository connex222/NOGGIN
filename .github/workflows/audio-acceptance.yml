name: NOGGIN Audio and Batch 1 Acceptance
on:
  push:
    branches: [main]
    paths:
      - tests/audio-end-to-end.test.js
      - tests/batch2-regression.test.js
      - tests/batch3-regression.test.js
      - tests/batch4-content-reveal.test.js
      - tests/batch5-bid-fairness.test.js
      - tests/batch6-answer-quality.test.js
      - data/unscramble.json
      - data/noise-clues.json
      - data/sketch-words.json
      - data/buzzer-questions.json
      - server/answer-match.js
      - server/games/phase4.js
      - data/bid-categories.json
      - server/games/phase5.js
      - server/rooms.js
      - data/close-call.json
      - data/higher-lower.json
      - server/games/phase3.js
      - server/games/phase5.js
      - public/play/play.css
      - public/play/studio.css
      - server/board.js
      - server/rooms.js
      - public/play/play.js
      - public/tv/tv.js
      - public/shared/client.js
      - .github/workflows/audio-acceptance.yml
      - public/voice/**
      - public/sounds/**
      - public/audio/tutorial/**
      - public/shared/creativeclaw-audio.json
      - public/tv/sound.js
      - public/tv/tutorial.js
      - server/games/**
      - server/rooms.js
      - server/gateway.js
      - data/unscramble.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --no-audit --no-fund
      - name: Static syntax checks
        run: npm run check
      - name: Run full regression suite, including server audio endpoint testing
        run: npm test
