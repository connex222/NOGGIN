name: Install NOGGIN Studio Voice Recordings
on:
  push:
    branches: [main]
    paths:
      - tools/creativeclaw-sources.json
      - .github/workflows/vendor-creativeclaw-audio.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noggin-studio-voice-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify recorded host announcements
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, time
          root=pathlib.Path('public/voice')
          root.mkdir(parents=True,exist_ok=True)
          data=json.loads(pathlib.Path('tools/creativeclaw-sources.json').read_text())
          expected=json.loads(pathlib.Path('public/shared/voice-lines.json').read_text())
          ids={item['id'] for item in expected['lines']}
          entries=data['voice']
          assert len(ids)==36 and len(entries)==36, (len(ids),len(entries))
          assert {key.removesuffix('.mp3') for key in entries}==ids
          for name,url in entries.items():
              assert name.endswith('.mp3') and url.startswith('https://cdn.creativeclaw.co/')
              target=root/name
              if target.exists() and target.stat().st_size>300:
                  continue
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'NOGGIN-asset-vendor/1.1'})
                      with urllib.request.urlopen(req,timeout=40) as response: raw=response.read(12000000)
                      if len(raw)<300 or not (raw.startswith(b'ID3') or (raw[0]==255 and raw[1]&224==224)):
                          raise ValueError('not a valid MP3 '+name)
                      target.write_bytes(raw)
                      print('Installed',name,len(raw))
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          mapping=root/'voice-manifest.json'
          mapping.write_text(json.dumps({'description':'All 36 Creative Claw host cues','lines':{id:[id+'.mp3'] for id in sorted(ids)}},indent=2)+'\n')
          audio=pathlib.Path('public/shared/creativeclaw-audio.json')
          current=json.loads(audio.read_text())
          current['voice']={name:'/voice/'+name for name in entries}
          audio.write_text(json.dumps(current,indent=2)+'\n')
          assert all((root/(id+'.mp3')).exists() for id in ids)
          PY
      - name: Validate host voice manifest
        run: |
          node -e "const m=require('./public/voice/voice-manifest.json'); if(Object.keys(m.lines).length!==36) process.exit(1)"
      - name: Commit host recordings to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voice public/shared/creativeclaw-audio.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(audio): install all 36 local host announcements"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
